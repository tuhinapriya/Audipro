[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fablet-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "httpx>=0.27,<1", "openai>=1.66,<3", "boto3>=1.34,<2", "python-dotenv>=1,<2", "Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
fablet = "fablet.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
